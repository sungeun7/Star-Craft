<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARCRRAFT - RTS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 플레이 메뉴 화면 (기본.jpg 배경 적용) -->
    <div id="play-menu" class="menu-screen">
        <div class="menu-bg"></div>
        <div class="menu-overlay"></div>
        <div class="menu-content">
            <h1 class="menu-title">STARCRRAFT</h1>
            <p class="menu-subtitle">Real Time Strategy</p>
            <div id="race-select" class="race-select-panel">
                <h2>종족 선택</h2>
                <p>플레이할 종족을 선택하세요</p>
                <div id="race-buttons">
                    <button id="race-terran" class="race-btn">
                        <span class="race-name">테란</span>
                        <span class="race-desc">인류. 기계와 화력.</span>
                    </button>
                    <button id="race-zerg" class="race-btn">
                        <span class="race-name">저그</span>
                        <span class="race-desc">침략 종족. 생체 유닛.</span>
                    </button>
                    <button id="race-protoss" class="race-btn">
                        <span class="race-name">프로토스</span>
                        <span class="race-desc">고등 문명. 사이오닉.</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-container">
        <!-- 중앙: 게임 화면 (맵만) -->
        <div class="game-area">
            <canvas id="game-canvas"></canvas>
        </div>

        <!-- 하단: 스타크래프트 스타일 커맨드 패널 (메뉴 틀 참고) -->
        <footer id="command-panel" class="menu-frame">
            <!-- 왼쪽: 자원 + 미니맵 -->
            <div id="panel-left" class="frame-inner">
                <div id="resources">
                    <div class="resource-item">
                        <img class="resource-icon mineral" src="assets/mineral.jpg" alt="미네랄" onerror="this.style.display='none'; this.nextElementSibling?.classList.add('show');">
                        <span class="resource-icon-fallback mineral" aria-hidden="true">◆</span>
                        <span id="minerals" class="resource-value">50</span>
                    </div>
                    <div class="resource-item">
                        <img class="resource-icon gas" src="assets/gas.jpg" alt="가스" onerror="this.style.display='none'; this.nextElementSibling?.classList.add('show');">
                        <span class="resource-icon-fallback gas" aria-hidden="true">◆</span>
                        <span id="gas" class="resource-value">0</span>
                    </div>
                    <div class="resource-item supply">
                        <span class="resource-label">인구</span>
                        <span id="supply" class="resource-value">8/30</span>
                    </div>
                </div>
                <div id="minimap-wrap">
                    <canvas id="minimap"></canvas>
                </div>
            </div>
            <!-- 가운데: 선택된 유닛/건물 정보 -->
            <div id="selected-info" class="frame-inner"></div>
            <!-- 오른쪽: 명령 카드(공격·정지 등) + 빌드 버튼 -->
            <div id="panel-right" class="frame-inner">
                <div id="action-panel">
                    <button type="button" id="btn-attack" class="action-btn" title="공격">공격</button>
                    <button type="button" id="btn-stop" class="action-btn" title="정지">정지</button>
                    <button type="button" id="btn-hold" class="action-btn" title="홀드">홀드</button>
                    <button type="button" id="btn-move" class="action-btn" title="이동">이동</button>
                    <button type="button" id="btn-patrol" class="action-btn" title="순찰">순찰</button>
                    <button type="button" id="btn-menu" class="action-btn" title="메뉴">메뉴</button>
                </div>
                <div id="build-panel"><!-- 종족별 유닛/건물 버튼 --></div>
            </div>
        </footer>
    </div>
    <script src="sound.js"></script>
    <script src="game.js"></script>
    <script>
        document.getElementById('race-terran').onclick = function() { if (window.startGame) window.startGame('terran'); };
        document.getElementById('race-zerg').onclick = function() { if (window.startGame) window.startGame('zerg'); };
        document.getElementById('race-protoss').onclick = function() { if (window.startGame) window.startGame('protoss'); };
    </script>
</body>
</html>
